[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docuflow-ml-sidecar"
version = "1.0.0"
description = "ML inference sidecar for DocuFlow - LayoutLM/Donut document understanding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Marc Velasquez", email = "velasquezmarcvictor@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "grpcio>=1.65.0",
    "grpcio-tools>=1.65.0",
    "protobuf>=4.25.0",
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-json-logger>=2.0.0",
    "prometheus-client>=0.19.0",
    "uvicorn>=0.29.0",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "black>=24.3.0",
    "pre-commit>=3.7.0",
]
gpu = [
    "torch[cuda]>=2.3.0",
]
onnx = [
    "onnxruntime-gpu>=1.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["docuflow_ml*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "T20", "TCH", "PT", "PTH", "ERA", "PL", "TRY", "SIM", "RET", "ARG", "FA", "PD", "ICN", "B", "PER", "RSE", "ASYNC", "LOG"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "S101", "T201", "T203", "PTH123"]
fixable = ["F", "I", "E", "W", "UP", "C90", "SIM", "RET", "ARG", "FA", "PD", "ICN", "B", "PER", "RSE", "ASYNC", "LOG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.coverage.run]
source = ["src/docuflow_ml"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]